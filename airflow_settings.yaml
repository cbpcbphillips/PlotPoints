# Loaded by `astro dev start` into the local Airflow metadata DB. Non-secret objects only.
airflow:
  pools:
    # TMDB is rate-limited in code (0.3s between calls), but that delay only holds within one
    # process. A single-slot pool makes it hold across every task Airflow schedules, wherever
    # they run: no two TMDB-hitting tasks ever overlap.
    - pool_name: tmdb_api
      pool_slot: 1
      pool_description: Serializes TMDB API calls so the per-process rate limit holds globally.
