[project]
name = "plotpoints"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.50",
    "cryptography>=49.0.0",
    "feedparser>=6.0.12",
    "numpy>=2.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "snowflake-connector-python>=4.7.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pre-commit>=4.6.0",
    "pytest>=9.0",
    "ruff>=0.15.20",
]
# The serving API (Phase 7). A separate group, so it never reaches the Airflow image's
# requirements.txt (scripts/export_airflow_requirements.py reads only [project].dependencies).
api = [
    "fastapi>=0.140",
    "uvicorn>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connection"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
# `-m snowflake` runs the tests that need the live warehouse; they are skipped by default.
markers = ["snowflake: needs live Snowflake credentials (numpy-vs-SQL equivalence)"]
addopts = "-m 'not snowflake'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]
