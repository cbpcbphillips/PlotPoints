[project]
name = "plotpoints"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.50",
    "cryptography>=49.0.0",
    "feedparser>=6.0.12",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "snowflake-connector-python>=4.7.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connection"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]
