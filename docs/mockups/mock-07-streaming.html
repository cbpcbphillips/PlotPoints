<style>
.svc{display:flex;flex-wrap:wrap;gap:10px}
.svc button{display:flex;align-items:center;gap:10px;padding:7px 14px 7px 7px;border-radius:14px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:600 14px var(--display);cursor:pointer;text-align:left}
.svc button small{display:block;font:400 11px var(--mono);color:var(--muted)}
.svc .mono-tile,.mono-tile.s{width:32px;height:32px;font-size:14px;border-radius:9px}
.svc button[aria-pressed="true"]{border-color:var(--accent-text);background:color-mix(in srgb,var(--accent-text) 12%,var(--surface))}
.svc button[aria-pressed="true"] small{color:var(--accent-text)}
.mono-tile.xs{width:20px;height:20px;font-size:10px;border-radius:6px}
.empty{border:1px dashed var(--border);border-radius:16px;padding:44px 20px;text-align:center;color:var(--muted)}
.stat{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin:24px 0 14px}.stat h2{font:700 clamp(24px,2.8vw,34px)/1.05 var(--title);letter-spacing:-.01em}.stat span{color:var(--muted);font-size:14px}
.pills{display:flex;gap:6px;flex-wrap:wrap}.pills button{font:600 13px var(--display);padding:7px 13px;border-radius:999px;border:1px solid var(--border);background:var(--raised);color:var(--text);cursor:pointer}
.pills button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent-text) 14%,var(--surface));border-color:var(--accent-text);color:var(--accent-text)}
/* A · tonight picker */
.tn{display:grid;grid-template-columns:260px 1fr;gap:22px;align-items:start;margin-top:22px}
.tn aside{padding:18px;display:grid;gap:18px}
.pick{display:grid;grid-template-columns:230px 1fr;gap:28px;padding:26px;position:relative;overflow:hidden}
.pick::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 90% at 12% 0,color-mix(in srgb,var(--accent) 20%,transparent),transparent 70%);pointer-events:none}
.pick>*{position:relative}.pick h2{font:700 clamp(32px,4vw,52px)/1 var(--title);letter-spacing:-.02em;margin:8px 0 6px}
.next{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.next .fc{flex:none}
/* B · matrix */
.mx{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.mx th{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 6px;text-align:center;background:var(--surface);border-bottom:1px solid var(--border)}
.mx th:first-child,.mx td:first-child{text-align:left;padding-left:16px}
.mx td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:center}
.mx tr:hover td{background:var(--raised)}
.mx .film{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;min-width:260px}.mx .film b{font:600 15px var(--title);display:block}.mx .film small{color:var(--muted)}
.mx .m{display:grid;grid-template-columns:1fr 40px;gap:8px;align-items:center;min-width:130px}.mx .m span{font:600 12px var(--mono);color:var(--accent-text);text-align:right}
.mx .d{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--border)}
.mx .d.has{background:var(--muted)}.mx .d.mine{background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.mx th.mine{color:var(--accent-text)}.mx td.mine-col{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.mx .none{color:var(--muted);font-size:12px}
.tablewrap{overflow-x:auto;padding:0}
/* C · columns */
.cols{display:flex;gap:16px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;margin-top:22px}
.col{flex:0 0 290px;padding:14px}
.col header{display:flex;align-items:center;gap:10px;margin-bottom:12px}.col header h2{font:700 19px var(--title)}.col header span{margin-left:auto;font:600 12px var(--mono);color:var(--muted)}
.cc{display:grid;grid-template-columns:54px 1fr;gap:12px;padding:9px;border-radius:12px;border:1px solid var(--border);background:var(--raised);margin-bottom:8px}
.cc:first-of-type{border-color:var(--accent-text)}
.cc b{font:600 14px/1.2 var(--title);display:block}.cc small{color:var(--muted);display:block;font-size:12px}.cc .pc{font:600 13px var(--mono);color:var(--accent-text)}
/* D · deck */
.deck{display:grid;grid-template-columns:1fr 300px;gap:28px;margin-top:26px;align-items:start}
.stack{position:relative;height:520px;max-width:760px}
.card{position:absolute;inset:0;display:grid;grid-template-columns:260px 1fr;gap:26px;padding:24px;transition:transform .35s,opacity .35s;transform-origin:50% 100%}
.card h2{font:700 38px/1 var(--title);letter-spacing:-.02em;margin:6px 0 4px}
.card.p1{transform:translateY(14px) scale(.965);opacity:.75}.card.p2{transform:translateY(28px) scale(.93);opacity:.45}
.card.gone{transform:translateX(120%) rotate(8deg);opacity:0}.card.nope{transform:translateX(-120%) rotate(-8deg);opacity:0}
.acts{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.queue{padding:16px;display:grid;gap:10px}
/* E · overview */
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:22px}
.stile{padding:16px;display:grid;gap:12px;cursor:pointer;text-align:left;font:inherit;color:inherit;border:1px solid var(--border);border-radius:16px;background:var(--surface)}
.stile[aria-pressed="true"]{border-color:var(--accent-text);box-shadow:0 0 0 1px var(--accent-text)}
.stile .hd{display:flex;gap:12px;align-items:center}.stile h3{font:700 18px var(--title)}.stile .hd small{display:block;color:var(--muted);font-size:12px}
.stile .bestm{display:grid;grid-template-columns:50px 1fr;gap:12px;align-items:center}.stile .bestm b{font:600 14px/1.2 var(--title);display:block}.stile .bestm small{color:var(--muted)}
.stile .nums{display:flex;gap:18px;font-size:12px;color:var(--muted)}.stile .nums b{display:block;font:600 18px var(--mono);color:var(--text)}
.detail{margin-top:22px}
@media (max-width:980px){.tn,.deck,.pick{grid-template-columns:1fr}.card{grid-template-columns:130px 1fr}.stack{height:420px}.card h2{font-size:26px}}
.svc{gap:8px}
.svc button{display:inline-flex;align-items:center;gap:9px;padding:6px 6px 6px 16px;border-radius:999px;font:600 14px var(--display)}
.svc button .n{min-width:26px;padding:3px 8px;border-radius:999px;background:var(--raised);font:600 12px var(--mono);color:var(--muted);text-align:center}
.svc button.none{opacity:.55}
.svc button[aria-pressed="true"]{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg);padding-left:12px}
.svc button[aria-pressed="true"]::before{content:"\2713";font-weight:700}
.svc button[aria-pressed="true"] .n{background:rgba(0,0,0,.2);color:var(--btn-fg)}
.svc button{padding:8px 16px}.svc button[aria-pressed="true"]{padding-left:12px}
