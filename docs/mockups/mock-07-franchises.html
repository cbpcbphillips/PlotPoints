<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlotPoints · 07 Franchises</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script>(function(){var t;try{t=localStorage.getItem('pp-theme')}catch(e){}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t})();</script>
<link rel="stylesheet" href="mock-07-shared.css">
<style>
.tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:6px 0 18px}
.tools .chip{cursor:pointer;font:600 13px var(--display)}
.shelf{display:grid;grid-template-columns:330px 1fr;gap:22px;margin-bottom:16px;padding:0;overflow:hidden}
.shelf .feat{padding:20px;display:grid;grid-template-columns:96px 1fr;gap:16px;border-right:1px solid var(--border);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 9%,var(--surface)),var(--surface));align-content:start}
.shelf .feat h2{grid-column:1/-1;font:700 26px/1.05 var(--title);letter-spacing:-.01em}
.shelf .feat h2 small{display:block;font:600 11px var(--mono);letter-spacing:.14em;color:var(--muted);margin-top:6px;text-transform:uppercase}
.prog{grid-column:1/-1;display:grid;gap:6px}
.prog .segs{display:flex;gap:3px}.prog .segs i{flex:1;height:6px;border-radius:3px;background:var(--raised)}
.prog .segs i.seen{background:var(--mint)}.prog .segs i.best{background:var(--accent)}
.prog span{font-size:12px;color:var(--muted)}.prog b{color:var(--text)}
.shelf .feat .bm{display:grid;gap:6px;align-content:start}.shelf .feat .bm b{font:600 17px/1.2 var(--title)}
.shelf .strip{padding:20px 20px 6px 0;min-width:0}
.shelf .strip .row{padding-bottom:10px}.shelf .fc{flex-basis:112px}
.shelf .fc.best .poster{border-color:var(--accent-text);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 40%,transparent),var(--shadow)}
.fc.seen .poster{filter:saturate(.55) brightness(.8)}
.fc.seen:hover .poster{filter:none}
.tag{position:absolute;top:6px;left:6px;z-index:3;font:700 10px var(--mono);letter-spacing:.06em;padding:3px 6px;border-radius:5px;display:inline-flex;gap:4px;align-items:center;background:rgba(11,13,23,.88);color:#ECEAF4;border:1px solid rgba(255,255,255,.18)}
.tag.rated{color:var(--accent)}.tag.seen{color:var(--mint)}
.tag.best{background:var(--btn-bg);color:var(--btn-fg);border-color:transparent}
.pct{font:600 12px var(--mono);color:var(--accent-text)}
.mine{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}.mine .stars{font-size:12px}
.hidden{display:none!important}
.note{color:var(--muted);font-size:13px;text-align:center;padding:18px 0 4px;border-top:1px solid var(--border);margin-top:22px}
@media (max-width:980px){.shelf{grid-template-columns:1fr}.shelf .feat{border-right:0;border-bottom:1px solid var(--border)}.shelf .strip{padding:0 20px 6px}}
</style></head>
<body data-page="fr">
<main class="wrap">
 <div class="pagehead"><p class="eyebrow">Your top 5 franchises</p><h1>Franchises</h1></div>
 <div class="tools"><span class="label">Show</span><button class="chip sel" type="button" data-f="all" aria-pressed="true">All films</button><button class="chip" type="button" data-f="unseen" aria-pressed="false">Unseen only</button><button class="chip" type="button" data-f="seen" aria-pressed="false">Seen only</button><span class="label" style="margin-left:14px">Order</span><button class="chip sel" type="button" data-o="year" aria-pressed="true">Release</button><button class="chip" type="button" data-o="score" aria-pressed="false">Score</button><span style="margin-left:auto;color:var(--muted);font-size:13px" id="tot"></span></div>
 <div id="shelves"></div>
</main>
<script src="mock-07-shared.js"></script>
<script>
(function(){
const {$,$$,poster,gauge,ov,stars}=PP;
// [title, year, hue, match, myRating, tmdbRating, rankingScore]  myRating: undefined = unseen, 0 = seen unrated, 0.5-5 = rated
const F=[
 {n:"Spider-Man",films:[["Spider-Man",2002,259,61,undefined,7.4,3.1],["Spider-Man 2",2004,306,56,undefined,7.3,2.6],["Spider-Man 3",2007,353,55,undefined,6.5,2.0],["The Amazing Spider-Man",2012,350,57,undefined,6.8,2.2],["The Amazing Spider-Man 2",2014,194,55,undefined,6.6,2.0],["Spider-Man: Homecoming",2017,325,0,4.0,7.3,0],["Spider-Man: Into the Spider-Verse",2018,319,0,5.0,8.4,0],["Spider-Man: Far From Home",2019,319,61,undefined,7.4,3.1],["Spider-Man: No Way Home",2021,343,64,undefined,7.9,3.8],["Spider-Man: Across the Spider-Verse",2023,138,62,undefined,8.4,4.2],["Spider-Man: Brand New Day",2026,87,0,4.5,7.9,0]]},
 {n:"Marvel Cinematic Universe",films:[["Iron Man",2008,122,53,undefined,7.7,2.4],["The Avengers",2012,76,52,undefined,8.1,2.5],["Guardians of the Galaxy",2014,340,51,undefined,7.9,2.7],["Captain America: The Winter Soldier",2014,14,50,undefined,7.7,2.1],["Guardians of the Galaxy Vol. 2",2017,45,48,undefined,7.6,2.0],["Thor: Ragnarok",2017,251,50,undefined,7.6,2.0],["Avengers: Infinity War",2018,32,54,undefined,8.2,3.0],["Avengers: Endgame",2019,298,51,undefined,8.2,2.6]]},
 {n:"X-Men",films:[["X-Men",2000,279,49,undefined,7.0,1.8],["X-Men: First Class",2011,166,45,undefined,7.3,1.6],["X-Men: Days of Future Past",2014,335,50,undefined,7.5,2.0],["Deadpool",2016,340,48,undefined,7.6,1.8],["X-Men: Apocalypse",2016,65,48,undefined,6.5,1.4],["Logan",2017,45,54,undefined,7.8,2.6],["Deadpool 2",2018,286,49,undefined,7.5,1.8],["Deadpool & Wolverine",2024,345,48,undefined,7.6,1.8]]},
 {n:"Blade Runner",films:[["Blade Runner",1982,66,48,undefined,7.9,2.2],["Blade Runner 2049",2017,208,50,undefined,7.6,2.3]]},
 {n:"The Maze Runner",films:[["The Maze Runner",2014,201,50,undefined,7.2,2.1],["Maze Runner: The Death Cure",2018,261,47,undefined,7.1,1.5]]}
];
const seen=x=>x[4]!==undefined,yrs=f=>f.films[0][1]+'–'+f.films[f.films.length-1][1];
F.forEach(f=>{const u=f.films.filter(x=>!seen(x));f.best=u.length?f.films.indexOf(u.reduce((a,x)=>x[6]>a[6]?x:a)):-1});
let filter='all',order='year';
function tagOf(x,isBest){if(isBest)return '<span class="tag best">BEST '+x[3]+'%</span>';if(!seen(x))return '';return x[4]>0?'<span class="tag rated">★ '+x[4]+'</span>':'<span class="tag seen">✓ SEEN</span>'}
function render(){
 let shown=0,total=0;
 $('#shelves').innerHTML=F.map(f=>{
  const nSeen=f.films.filter(seen).length,b=f.best>=0?f.films[f.best]:null;
  const films=f.films.map((x,i)=>({x,i})).filter(({x})=>filter==='all'||(filter==='seen')===seen(x)).sort(order==='score'?(a,b)=>(b.x[6]-a.x[6])||((b.x[4]||0)-(a.x[4]||0)):(a,b)=>a.i-b.i);
  total+=f.films.length;shown+=films.length;if(!films.length)return '';
  const feat=b?'<div>'+poster(b[0],b[2])+'</div><div class="bm"><span class="eyebrow">Best match · unseen</span><b>'+b[0]+'</b><span style="color:var(--muted);font-size:13px">'+b[1]+' · TMDB '+b[5]+'</span>'+gauge(b[6])+'<button class="btn primary" style="padding:9px 12px;font-size:13px;margin-top:4px" type="button">+ Watchlist</button></div>':'<div class="bm" style="grid-column:1/-1"><span class="eyebrow" style="color:var(--mint)">Completed</span><b>You have seen all '+f.films.length+'.</b></div>';
  return '<article class="panel shelf"><div class="feat"><h2>'+f.n+'<small>'+f.films.length+' films · '+yrs(f)+'</small></h2><div class="prog"><div class="segs" role="img" aria-label="'+nSeen+' of '+f.films.length+' seen">'+f.films.map((x,i)=>'<i class="'+(i===f.best?'best':seen(x)?'seen':'')+'"></i>').join('')+'</div><span><b>'+nSeen+' of '+f.films.length+'</b> seen · '+(f.films.length-nSeen)+' to go</span></div>'+feat+'</div><div class="strip"><p class="label" style="margin-bottom:10px">In this franchise · '+(order==='score'?'ranked by score':'release order')+'</p><div class="row">'+films.map(({x,i})=>'<figure class="fc'+(i===f.best?' best':'')+(seen(x)?' seen':'')+'"><div class="pw">'+tagOf(x,i===f.best)+poster(x[0],x[2],'sm')+(seen(x)?'<div class="ov"><button class="mini" type="button">Edit rating</button><button class="mini" type="button">Rewatch next</button></div>':ov)+'</div><figcaption><b>'+x[0]+'</b><small>'+x[1]+'</small>'+(seen(x)?'<span class="mine">You rated '+(x[4]>0?stars(x[4]):'—')+'</span>':'<span class="pct">'+x[3]+'% match</span>')+'</figcaption></figure>').join('')+'</div></div></article>'}).join('');
 $('#tot').textContent=shown+' of '+total+' films shown';
}
$$('[data-f]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.f;$$('[data-f]').forEach(x=>{x.setAttribute('aria-pressed',x===b);x.classList.toggle('sel',x===b)});render()}));
$$('[data-o]').forEach(b=>b.addEventListener('click',()=>{order=b.dataset.o;$$('[data-o]').forEach(x=>{x.setAttribute('aria-pressed',x===b);x.classList.toggle('sel',x===b)});render()}));
render();
})();
</script>
</body></html>
