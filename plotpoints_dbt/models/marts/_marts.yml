version: 2

models:
  - name: dim_media
    description: One row per title (movie/TV), scalar attributes.
    columns:
      - name: media_key
        tests: [unique, not_null]
  - name: dim_person
    description: One row per person, keyed on TMDB person_id.
    columns:
      - name: person_id
        tests: [unique, not_null]
  - name: dim_genre
    columns:
      - name: genre_id
        tests: [unique, not_null]
  - name: dim_keyword
    columns:
      - name: keyword_id
        tests: [unique, not_null]
  - name: dim_user
    columns:
      - name: user_id
        tests: [unique, not_null]
  - name: dim_date
    columns:
      - name: date_day
        tests: [unique, not_null]

  - name: fct_diary_entry
    description: One row per watch event.
    columns:
      - name: diary_entry_key
        tests: [unique, not_null]
      - name: media_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_media')
                field: media_key
      - name: user_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_user')
                field: user_id

  - name: media_embeddings
    description: >
      One Cortex embedding per title (see vars embedding_model / embedding_dimension).
      Incremental on document_hash -- a rerun re-embeds only changed titles.
    columns:
      - name: media_key
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_media')
                field: media_key
      - name: embedding
        tests: [not_null]
      - name: document_hash
        tests: [not_null]

  - name: bridge_media_person
    columns:
      - name: media_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_media')
                field: media_key
      - name: person_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_person')
                field: person_id
  - name: bridge_media_genre
    columns:
      - name: genre_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_genre')
                field: genre_id
  - name: bridge_media_keyword
    columns:
      - name: keyword_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_keyword')
                field: keyword_id

  - name: mart_pipeline_health
    description: >
      Per-load-batch health of the RAW landings: row counts, enrichment match rate and
      completeness of embedding-document fields. Reads RAW directly (not deduped staging) so a
      bad batch can't be hidden by newer rows.
    columns:
      - name: batch
        tests: [not_null]
      - name: match_rate
        tests: [not_null]
  - name: mart_embedding_coverage
    description: >
      One row. Titles with a current embedding vs missing vs stale (document or model changed
      since embedding). Non-zero missing/stale after a build means something is wrong.
    columns:
      - name: coverage
        tests: [not_null]
