version: 2

sources:
  - name: raw
    database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
    schema: RAW
    description: Landing tables loaded by src/load_snowflake.py (one VARIANT record per row).
    # Ingest is manually triggered, so "stale" is the failure mode that actually occurs: nobody
    # refreshed the catalog. `dbt source freshness` (run by the pipeline_monitor DAG) reads the
    # loaded_at column COPY already stamps on every row.
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after: {count: 30, period: day}
        error_after: {count: 90, period: day}
    tables:
      - name: diary_entries
        description: One row per Letterboxd watch event; natural key (letterboxd_username, guid).
      - name: tmdb_titles
        description: One row per catalog title; natural key (media_type, tmdb_id).
      - name: user_imports
        description: >
          One row per consented import, landed from the S3 inbox the API writes to. `record`
          holds the payload (user_id, source, films). Deleted on request by user_ingest.
        config:
          freshness: null   # imports arrive when people choose to; silence is not a failure
      - name: user_deletions
        description: Deletion requests (SHA-256 of a one-time token), kept as tombstones.
        config:
          freshness: null
