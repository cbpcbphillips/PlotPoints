# Connection profile for dbt. Values come from .env via env_var() so no secrets
# are committed. Run dbt with the .env vars exported into the environment, e.g.:
#   set -a && source .env && set +a
#   uvx --from dbt-snowflake==1.12.0 dbt build \
#     --project-dir plotpoints_dbt --profiles-dir plotpoints_dbt
plotpoints:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      schema: MART
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      threads: 4
      client_session_keep_alive: false
