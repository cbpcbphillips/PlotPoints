<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Find films you have not seen, ranked by how close they are to the ones you rated highly." />
    <title>PlotPoints</title>
    <script>
      // Set the theme before first paint so a dark-mode visitor never sees a light flash.
      try {
        var t = localStorage.getItem('pp-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
